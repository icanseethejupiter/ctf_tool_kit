[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-capturer"
version = "0.4.0"
description = "Point it at a file or a string and it digs out CTF flags through layers of encoding."
readme = "README.md"
requires-python = ">=3.8"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [{name = "Alex Min"}]
keywords = ["ctf", "flag", "forensics", "decoder", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = ["dnfile>=0.18,<0.19", "dncil>=1.0.2,<2", "dpkt>=1.9.8,<2",
                "capstone>=5,<6", "pyelftools>=0.32,<0.33"]

[project.urls]
Homepage = "https://github.com/icanseethejupiter/ctf_tool_kit"

[project.scripts]
flag_capturer = "flag_capturer.cli:main"
flagcap = "flag_capturer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
