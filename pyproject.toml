[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-capturer"
version = "0.1.0"
description = "Point it at a file or a string and it digs out CTF flags through layers of encoding."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "PolyForm-Strict-1.0.0"}
authors = [{name = "Alex Min"}]
keywords = ["ctf", "flag", "forensics", "decoder", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/icanseethejupiter/ctf_tool_kit"

[project.scripts]
flag_capturer = "flag_capturer.cli:main"
flagcap = "flag_capturer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
